name: Update Kindle Calendar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kindle-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python render.py
        env:
          FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - name: Record daily refresh activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(TZ=Asia/Hong_Kong date +%F)
          if [ "$(cat .last-refresh 2>/dev/null || true)" != "$TODAY" ]; then
            printf '%s\n' "$TODAY" > .last-refresh
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .last-refresh
            git commit -m "Record calendar refresh $TODAY"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
